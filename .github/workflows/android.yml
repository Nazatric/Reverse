# Builds the native Android port on GitHub's runners — the authoring sandbox has no Android SDK
# and no route to Google Maven, so the runner is the source of truth for "does it compile".
#
# Runs on every push to the working branch: assembles debug + release APKs, runs the JVM unit
# tests, and uploads the APKs as artifacts. The instrumented visual-parity capture runs in a
# separate job on an emulator (see parity.yml once the capture test is wired up).
name: Android build

on:
  push:
    branches: [arena/a51545a7-reverse, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-disabled: false

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Assemble release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android/app/build/test-results/**/*.xml
          if-no-files-found: ignore
