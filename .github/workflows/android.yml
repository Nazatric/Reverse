# Builds the native Android port on GitHub's runners — the authoring sandbox has no Android SDK
# and no route to Google Maven, so the runner is the source of truth for "does it compile".
#
# Runs on every push: assembles debug + release APKs, runs the JVM unit tests, uploads the APKs.
# Compiler errors are re-emitted as `::error` workflow commands so they surface as check-run
# annotations, readable through the GitHub REST API from constrained networks.
name: Android build

on:
  push:
    branches: [arena/a51545a7-reverse, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee -a /tmp/build.log; exit "${PIPESTATUS[0]}"

      - name: Assemble release APK
        run: gradle --no-daemon :app:assembleRelease 2>&1 | tee -a /tmp/build.log; exit "${PIPESTATUS[0]}"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee -a /tmp/build.log; exit "${PIPESTATUS[0]}"

      # The artifact store is not reachable from the authoring network, so the test report is
      # re-emitted as annotations: which tests failed, with their assertion messages.
      - name: Report unit test results
        if: always()
        run: python3 ../.github/report_tests.py app/build/test-results/testDebugUnitTest/*.xml

      - name: Instrumented test APK (parity harness compiles)
        run: gradle --no-daemon :app:assembleDebugAndroidTest 2>&1 | tee -a /tmp/build.log; exit "${PIPESTATUS[0]}"

      - name: Surface build errors as annotations
        if: failure()
        run: |
          touch /tmp/build.log
          # GitHub allows only ~10 annotations per level per step, so pack the whole failure
          # block into a single annotation (pipes as line breaks) to stay under the cap.
          BLOCK="$(tail -140 /tmp/build.log | tr '\n' '|' | tr -d '\r')"
          echo "::error::BUILDFAIL ${BLOCK}"
          STRIP="s#file:///home/runner/work/Reverse/Reverse/android/app/src/##"
          CNT="$(grep -E '^e: ' /tmp/build.log | sed -E "$STRIP; s#:[0-9]+:[0-9]+.*##" | sort | uniq -c | tr '\n' '|')"
          if [ -n "$CNT" ]; then echo "::error::FILECOUNTS ${CNT}"; fi
          KERR="$(grep -E '^e: ' /tmp/build.log | sed -E "$STRIP; s/^[^ ]+ [0-9]+:[0-9]+ //" | sort | uniq -c | sort -rn | head -60 | tr '\n' '|')"
          if [ -n "$KERR" ]; then echo "::error::KOTLIN ${KERR}"; fi

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android/app/build/test-results/**/*.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The reference half of the visual parity pipeline: build the *production* web
  # app, render every screen in headless Chromium at the parity viewports, and
  # publish the PNGs the native captures are diffed against.
  # ---------------------------------------------------------------------------
  parity-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Install parity dependencies
        working-directory: parity
        run: npm ci

      - name: Capture reference screenshots
        working-directory: parity
        run: node web/capture.mjs 2>&1 | tee /tmp/capture.log; exit "${PIPESTATUS[0]}"

      - name: Report the capture
        if: always()
        run: |
          echo "::notice::CAPTURE $(find parity/out -name '*.png' 2>/dev/null | wc -l) png files"
          find parity/out -name '*.png' 2>/dev/null | sort | head -40
          if [ -s /tmp/capture.log ]; then
            echo "::error::CAPTURELOG $(tail -40 /tmp/capture.log | tr '\n' '|' | tr -d '\r')"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-reference
          path: parity/out
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The native half of the parity pipeline: boot an emulator, run the capture
  # harness against the real activity, pull the PNGs off the device.
  # Kept non-blocking: emulator boot on a hosted runner is not dependable enough
  # to gate the build on, and its output is diagnostic.
  # ---------------------------------------------------------------------------
  parity-native:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 system-images;android-30;default;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::/dev/kvm is not present; the emulator will be very slow"

      - name: Capture native screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel
          ram: 2048
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -no-metrics -no-jni -skin 412x915
          script: bash .github/parity_native.sh 412x915 com.thegadget.app.parity.BootSmokeTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-native
          path: parity/out/native
          if-no-files-found: warn


  # ---------------------------------------------------------------------------
  # On a v* tag: build the APKs and publish a GitHub Release with the changelog.
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug and release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/the-gadget-debug.apk
          for f in app/build/outputs/apk/release/*.apk; do cp "$f" /tmp/the-gadget-release.apk; done
          gh release create "${GITHUB_REF_NAME}" \
            /tmp/the-gadget-debug.apk /tmp/the-gadget-release.apk \
            --title "The Gadget ${GITHUB_REF_NAME}" \
            --notes-file ../CHANGELOG.md
