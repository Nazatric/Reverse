# Builds the native Android port on GitHub's runners — the authoring sandbox has no Android SDK
# and no route to Google Maven, so the runner is the source of truth for "does it compile".
#
# Runs on every push: assembles debug + release APKs, runs the JVM unit tests, uploads the APKs.
# Compiler errors are re-emitted as `::error` workflow commands so they surface as check-run
# annotations, readable through the GitHub REST API from constrained networks.
name: Android build

on:
  push:
    branches: [arena/a51545a7-reverse, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee -a /tmp/build.log; exit "${PIPESTATUS[0]}"

      - name: Assemble release APK
        run: gradle --no-daemon :app:assembleRelease 2>&1 | tee -a /tmp/build.log; exit "${PIPESTATUS[0]}"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee -a /tmp/build.log; exit "${PIPESTATUS[0]}"

      - name: Surface build errors as annotations
        if: failure()
        run: |
          touch /tmp/build.log
          # Any line that looks like a real failure becomes a readable annotation.
          grep -nE "^e: |error:|FAILURE:|What went wrong|Could not |Unresolved reference|Caused by:|A problem occurred|Execution failed|> Task .*FAILED|cannot find symbol|Unsupported|incompatible|No matching variant|requires|Plugin with id" /tmp/build.log \
            | head -70 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          # The full failure tail, one annotation per line, so nothing is truncated away.
          grep -nE "requires libraries|use a|compileSdk|minCompileSdk|newer|Dependency '|checkDebugAarMetadata|What went wrong|Try:|http" /tmp/build.log | tail -40 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android/app/build/test-results/**/*.xml
          if-no-files-found: ignore
