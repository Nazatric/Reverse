[versions]
# --- Toolchain -------------------------------------------------------------------------------
# Kotlin 2.4.20  — latest published release, verified on GitHub (JetBrains/kotlin, 2026-09-07).
kotlin = "2.4.20"
# KSP2 is versioned independently of Kotlin since KSP2 (Analysis-API based). Latest published
# release, verified on GitHub (google/ksp, 2.3.12, 2026-09-09).
ksp = "2.3.12"
# Android Gradle Plugin. 8.13.x is the current stable line; 9.x is required only by the next
# Compose train (see README "upgrade path"). Verified against the androidx build (which is on
# androidGradlePlugin = 9.5.0-alpha08 for its own tip-of-tree builds).
agp = "8.13.0"

# --- AndroidX --------------------------------------------------------------------------------
# The androidx-main `libraryversions.toml` (fetched 2026-10-07) tracks *development* versions;
# each stable line is one minor behind the tip, which is how these were chosen. Google Maven is
# not reachable from the authoring sandbox, so run `./gradlew dependencyUpdates` (or the Android
# Studio upgrade assistant) once to confirm before shipping a release build.
composeBom = "2025.06.01"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
navigationCompose = "2.9.0"
room = "2.7.1"
datastore = "1.1.7"
annotation = "1.9.1"
collection = "1.5.0"
# Media3 1.11.1 — latest stable, verified via the AndroidX Media3 release notes (2026-09-10).
media3 = "1.7.1"

# --- Third party (licence + maintenance reviewed; see THIRD_PARTY.md) ------------------------
# Coil 3.6.3 — Apache-2.0, actively released (verified on GitHub, 2026-09-18).
coil = "3.2.0"
# HiveMQ MQTT Client 1.4.0 — Apache-2.0, MQTT 5.0, the only maintained Android-capable MQTT 5
# client (verified on GitHub, 2026-08-21). Ships a dedicated `android` classifier-free artifact
# that excludes the JVM-only Netty epoll transport.
hivemq = "1.4.0"
# kotlinx 1.11.0 / 1.11.0 — verified stable releases (2026-05-08 / 2026-04-09).
coroutines = "1.11.0"
serialization = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-collection = { group = "androidx.collection", name = "collection", version.ref = "collection" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }

coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }

hivemq-mqtt = { group = "com.hivemq", name = "hivemq-mqtt-client", version.ref = "hivemq" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

junit = { group = "junit", name = "junit", version = "4.13.2" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version = "1.3.0" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }
androidx-test-rules = { group = "androidx.test", name = "rules", version = "1.6.1" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
